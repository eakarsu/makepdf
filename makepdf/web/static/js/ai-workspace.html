<script nonce="__NONCE__" src="/static/js/ai-report.js"></script><script nonce="__NONCE__">(function (global) {

</button></div></header><div data-report-body>${global.BrowserAIReport.render(state.result)}</div></article>`:''}</div></div><section class="native-vanilla-records"><h3>Stored records</h3><button type="button" data-action="refresh">Refresh records</button>${config.resources.map(resource=>`<article><h4>${escape(resource.label)}</h4>${!(state.records[resource.key]||[]).length?'<p>No records returned.</p>':`<div class="browser-report-table"><table><thead><tr><th>Record</th><th>Reference</th><th>Details</th></tr></thead><tbody>${state.records[resource.key].map(row=>`<tr><td>${escape(row.name||row.title||row.employeeName||row.planName||row.id)}</td><td>${escape(row.id)}</td><td><button type="button" data-action="record" data-resource="${escape(resource.key)}" data-id="${escape(row.id)}">Open record</button></td></tr>`).join('')}</tbody></table></div>`}</article>`).join('')}</section>`;

    }
    function preset(index){
      const manual=[];

        else if(field.manual){if(!state.fields[field.key])manual.push(field.label);}

    }

      event.preventDefault();if(state.busy||!state.authenticated)return;
      const active=feature();const body={};let multipart;if(missingRequired().length){state.error='Supply actual '+missingRequired().map(field=>field.label).join(', ')+' before generating.';render();return;}
      try{
        for(const field of active.fields){const value=state.fields[field.key];if(field.type==='file'){if(field.required&&!state.files[field.key])throw new Error('Choose an actual '+field.label+' before generating.');continue;}if(value==null||value===''){if(field.required)throw new Error(field.label+' is required.');continue;}body[field.key]=field.type==='json'?JSON.parse(value):field.type==='number'?Number(value):value;}

function signout(){token='';sessionStorage.removeItem(config.storageKey);studio?.setAuthenticated(false);document.getElementById('native-workspace').hidden=true;document.getElementById('native-login').hidden=false;document.querySelector('.native-vanilla-backdrop')?.remove();document.body.style.overflow='';historyRows=[];document.getElementById('native-history-list').replaceChildren();}
async function verify(){const value=await request(config.meEndpoint||'/api/auth/me');document.getElementById('native-identity').textContent='Signed in as '+(value.user?.email||value.email||'authenticated reviewer');document.getElementById('native-workspace').hidden=false;document.getElementById('native-login').hidden=true;if(!studio)studio=window.NativeWorkflowStudio.mount({element:document.getElementById('native-ai-studio'),config:config.studio,request});studio.setAuthenticated(true);if(config.historyEndpoint)loadHistory();else document.getElementById('native-history').hidden=true;}
async function loadHistory(){const status=document.getElementById('native-history-status');try{const value=await request(config.historyEndpoint);historyRows=Array.isArray(value)?value:value.results||value.history||value.reports||value.data||[];status.textContent=historyRows.length?'':'No saved responses returned.';document.getElementById('native-history-list').innerHTML=historyRows.map((row,index)=>'<button type="button" data-index="'+index+'"><strong>'+esc(row.title||row.output?.user_title||row.feature||'Saved report')+'</strong><br>'+esc(row.model||'')+' · '+esc(row.createdAt||row.created_at||'')+'</button>').join('');}catch(error){status.textContent=error.message;}}
function historyDialog(row){const overlay=document.createElement('div');overlay.className='native-vanilla-backdrop';const previous=document.activeElement;let busy=false;const content=row.output??row.content??row.response??row.result;overlay.innerHTML='<section class="native-vanilla-dialog" role="dialog" aria-modal="true" tabindex="-1"><header><h2>'+esc(row.title||row.output?.user_title||row.feature||'Saved report')+'</h2><button type="button" data-action="cancel">Cancel</button></header><div class="native-vanilla-dialog-body">'+(config.historyMutation?'<label>Report title<input name="title" maxlength="160" value="'+esc(row.title||row.output?.user_title||row.feature||'Saved report')+'"></label>':'')+window.BrowserAIReport.render(content)+'<p role="alert" id="native-history-error"></p></div><footer>'+(config.historyMutation?'<button type="button" data-action="save">Edit title</button><button type="button" data-action="delete" class="danger">Delete</button>':'')+'<button type="button" data-action="cancel">Cancel</button></footer></section>';
const close=()=>{if(busy)return;overlay.remove();document.body.style.overflow='';previous?.focus();};overlay.addEventListener('click',async event=>{if(event.target===overlay){close();return;}const action=event.target.closest('[data-action]')?.dataset.action;if(action==='cancel'){close();return;}if(!['save','delete'].includes(action))return;if(action==='delete'&&!confirm('Delete this saved AI response?'))return;busy=true;overlay.querySelectorAll('button').forEach(node=>node.disabled=true);try{await request(config.historyMutation+'/'+encodeURIComponent(row.id),{method:action==='save'?'PUT':'DELETE',...(action==='save'?{body:JSON.stringify({title:overlay.querySelector('[name=title]').value})}:{})});busy=false;close();await loadHistory();}catch(error){busy=false;overlay.querySelectorAll('button').forEach(node=>node.disabled=false);overlay.querySelector('#native-history-error').textContent=error.message;}});overlay.addEventListener('keydown',event=>{if(event.key==='Escape')close();if(event.key==='Tab'){const nodes=[...overlay.querySelectorAll('button,input')].filter(node=>!node.disabled);if(event.shiftKey&&document.activeElement===nodes[0]){event.preventDefault();nodes.at(-1)?.focus();}else if(!event.shiftKey&&document.activeElement===nodes.at(-1)){event.preventDefault();nodes[0]?.focus();}}});document.body.append(overlay);document.body.style.overflow='hidden';overlay.querySelector('[role=dialog]').focus();}
document.getElementById('native-login-form').addEventListener('submit',async event=>{event.preventDefault();document.getElementById('native-login-error').textContent='';try{const form=new FormData(event.currentTarget);const value=await request(config.loginEndpoint||'/api/auth/login',{method:'POST',body:JSON.stringify({email:form.get('email'),password:form.get('password')})});token=value.token||value.accessToken||value.access_token;if(!token)throw new Error('The native login returned no session token.');sessionStorage.setItem(config.storageKey,token);await verify();event.target.reset();}catch(error){document.getElementById('native-login-error').textContent=error.message;}});
document.getElementById('native-signout').addEventListener('click',signout);document.getElementById('native-history-refresh').addEventListener('click',loadHistory);document.getElementById('native-history-list').addEventListener('click',event=>{const node=event.target.closest('[data-index]');if(node)historyDialog(historyRows[Number(node.dataset.index)]);});
if(token)verify().catch(()=>signout());
</script></body></html>
